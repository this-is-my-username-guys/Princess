<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Parallax Photo Carousel</title>
  
  <link rel="stylesheet" href="https://public.codepenassets.com/css/reset-2.0.min.css">

  <!-- External Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.6.1/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/zepto/1.2.0/zepto.min.js"></script>

  <style>
    html, body, .stage, .ring, .img {
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      user-select: none;
    }

    html, body, .stage {
      overflow: hidden;
      background: url('images/background.png') no-repeat center center fixed;
      background-size: cover;
      margin: 0;
      padding: 0;
      font-family: Georgia, serif;
    }

    div, svg {
      position: absolute;
    }

    .container {
      perspective: 2000px;
      width: 300px;
      height: 400px;  
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
    }

    .img {
      width: 100%;
      height: 100%;
      border-radius: 10px;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
      transition: opacity 0.3s ease;
      overflow: hidden;
    }

    .img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
      border-radius: 10px;
      transition: transform 0.4s ease;
    }


  .poetic-caption {
  position: absolute;
  top: calc(50% + 230px); /* Below the 400px carousel */
  width: 100%;
  text-align: center;
  font-size: 5rem;
  color: #fff;
  font-style: italic;
  font-weight: bold;
  letter-spacing: 2px;
  text-shadow: 0 0 15px #fff, 0 0 20px #fff, 0 0 30px #ffffffaa;
  pointer-events: none;
  opacity: 0;
  animation: fadeIn 3s ease 2s forwards;
}



    @keyframes fadeIn {
      to { opacity: 1; }
    }

  .next-page-btn {
  position: absolute;
  bottom: 40px;
  left: 50%;
  transform: translateX(-50%);
  
  padding: 14px 30px;
  border: 1px solid rgba(255,255,255,0.7);
  border-radius: 30px;
  
  color: white;
  text-decoration: none;
  font-family: Georgia, serif;
  font-size: 1.1rem;
  letter-spacing: 1px;
  
  background: rgba(0,0,0,0.25);
  backdrop-filter: blur(8px);
  
  box-shadow: 0 0 15px rgba(255,255,255,0.2);
  transition: all 0.3s ease;
}

.next-page-btn:hover {
  background: rgba(255,255,255,0.15);
  box-shadow: 0 0 25px rgba(255,255,255,0.5);
  transform: translateX(-50%) scale(1.05);
}
  </style>
</head>
<body>

<div class="stage">
  <div class="container">
    <div class="ring">
      <div class="img"></div>
      <div class="img"></div>
      <div class="img"></div>
      <div class="img"></div>
      <div class="img"></div>
      <div class="img"></div>
      <div class="img"></div>
      <div class="img"></div>
      <div class="img"></div>
      <div class="img"></div>
    </div>
  </div>
</div>

<div class="poetic-caption">
  Nunc scio quid sit amor.... <strong>est tu</strong>.
</div>

<a href="journal.html" class="next-page-btn">
  Continue →
</a>

<script>
  let xPos = 0;

  const imageURLs = [
    'images/photo1.jpg',
    'images/photo2.jpg',
    'images/photo3.jpg',
    'images/photo4.jpg',
    'images/photo5.jpg',
    'images/photo6.png',
    'images/photo7.jpg',
    'images/photo8.jpg',
    'images/photo9.jpg',
    'images/photo10.jpg'
  ];

  // Inject images into the .img divs
  document.querySelectorAll('.img').forEach((el, i) => {
    const img = document.createElement('img');
    img.src = imageURLs[i];
    el.appendChild(img);
  });

  gsap.timeline()
    .set('.ring', { rotationY: 180, cursor: 'grab' })
    .set('.img', {
      rotateY: (i) => i * -36,
      transformOrigin: '50% 50% 500px',
      z: -500,
      backfaceVisibility: 'hidden'
    })
    .from('.img', {
      duration: 1.5,
      y: 200,
      opacity: 0,
      stagger: 0.1,
      ease: 'expo'
    })
    

  $(window).on('mousedown touchstart', dragStart);
  $(window).on('mouseup touchend', dragEnd);

  function dragStart(e) {
    if (e.touches) e.clientX = e.touches[0].clientX;
    xPos = Math.round(e.clientX);
    gsap.set('.ring', { cursor: 'grabbing' });
    $(window).on('mousemove touchmove', drag);
  }

  function drag(e) {
    if (e.touches) e.clientX = e.touches[0].clientX;

    gsap.to('.ring', {
      rotationY: '-=' + ((Math.round(e.clientX) - xPos) % 360)
    });

    xPos = Math.round(e.clientX);
  }

  function dragEnd(e) {
    $(window).off('mousemove touchmove', drag);
    gsap.set('.ring', { cursor: 'grab' });
  }
</script>

</body>
</html>
